<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Lista de Tarefas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(255,255,255,0.06);
      --glass-brd: rgba(255,255,255,0.10);
      --text-muted: #b8c2d6;
      --green: #19c27b;
      --red: #e23b4a;
      --yellow: #f6c344;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0e1118;
      color: #eaf2ff;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: none;
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      transform: translateZ(0);
      will-change: transform;
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      pointer-events: none;
    }

    .container-main {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header-todo {
      text-align: center;
      margin-bottom: 40px;
    }

    .header-todo h1 {
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffd700, #ffec8b, #fff6c2, #ffd700);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldFlow 4s ease infinite;
    }

    @keyframes goldFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header-todo p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-brd);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 24px;
    }

    .input-group-todo {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .input-group-todo input {
      flex: 1;
      background: rgba(255,255,255,0.08) !important;
      border: 1px solid rgba(255,255,255,0.18) !important;
      color: #eaf2ff !important;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .input-group-todo input:focus {
      background: rgba(255,255,255,0.12) !important;
      border-color: rgba(185,140,255,0.4) !important;
      box-shadow: 0 0 20px rgba(185,140,255,0.2);
      outline: none;
    }

    .input-group-todo input::placeholder {
      color: rgba(234,242,255,0.5);
    }

    .btn-add {
      background: linear-gradient(135deg, rgba(185,140,255,0.8), rgba(120,190,255,0.8));
      border: 1px solid rgba(185,140,255,0.4);
      color: #fff;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-add:hover {
      background: linear-gradient(135deg, rgba(185,140,255,1), rgba(120,190,255,1));
      box-shadow: 0 10px 30px rgba(185,140,255,0.3);
      transform: translateY(-2px);
    }

    .btn-add:active {
      transform: translateY(0);
    }

    .stats-todo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 900;
    }

    .stat-value.total { color: #7dd3fc; }
    .stat-value.completed { color: var(--green); }
    .stat-value.pending { color: var(--yellow); }

    .filter-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #eaf2ff;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .filter-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.20);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, rgba(185,140,255,0.8), rgba(120,190,255,0.8));
      border-color: rgba(185,140,255,0.4);
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 16px;
      transition: all 0.3s ease;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .todo-item:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
    }

    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .checkbox-todo {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: var(--green);
      flex-shrink: 0;
    }

    .todo-content {
      flex: 1;
      min-width: 0;
    }

    .todo-text {
      font-size: 1.05rem;
      margin-bottom: 6px;
      word-break: break-word;
      transition: all 0.3s ease;
    }

    .todo-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .todo-date {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .todo-category {
      display: inline-block;
      background: rgba(185,140,255,0.2);
      color: rgba(185,140,255,0.9);
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .todo-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-action {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      color: #eaf2ff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-size: 1.1rem;
    }

    .btn-action:hover {
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
    }

    .btn-delete:hover {
      border-color: var(--red);
      color: var(--red);
      background: rgba(226,59,74,0.1);
    }

    .btn-edit:hover {
      border-color: var(--yellow);
      color: var(--yellow);
      background: rgba(246,195,68,0.1);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state i {
      font-size: 4rem;
      color: rgba(255,255,255,0.1);
      margin-bottom: 20px;
      display: block;
    }

    .empty-state h3 {
      color: var(--text-muted);
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .empty-state p {
      color: rgba(255,255,255,0.4);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--glass-bg);
      border: 1px solid var(--glass-brd);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      margin-bottom: 24px;
    }

    .modal-header h2 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0;
    }

    .modal-body {
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: #eaf2ff;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: rgba(255,255,255,0.08) !important;
      border: 1px solid rgba(255,255,255,0.18) !important;
      color: #eaf2ff !important;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.3s ease;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      background: rgba(255,255,255,0.12) !important;
      border-color: rgba(185,140,255,0.4) !important;
      box-shadow: 0 0 20px rgba(185,140,255,0.2);
      outline: none;
    }

    .modal-footer {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .btn-modal {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, rgba(185,140,255,0.8), rgba(120,190,255,0.8));
      color: #fff;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, rgba(185,140,255,1), rgba(120,190,255,1));
      box-shadow: 0 10px 30px rgba(185,140,255,0.3);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #eaf2ff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.20);
    }

    .close-modal {
      background: none;
      border: none;
      color: #eaf2ff;
      font-size: 1.5rem;
      cursor: pointer;
      position: absolute;
      top: 15px;
      right: 15px;
      opacity: 0.7;
      transition: opacity 0.3s ease;
    }

    .close-modal:hover {
      opacity: 1;
    }

    @media (max-width: 576px) {
      .container-main {
        padding: 20px 15px;
      }

      .header-todo h1 {
        font-size: 2rem;
      }

      .input-group-todo {
        flex-direction: column;
      }

      .btn-add {
        width: 100%;
        justify-content: center;
      }

      .stats-todo {
        grid-template-columns: 1fr;
      }

      .filter-buttons {
        justify-content: center;
      }

      .todo-actions {
        gap: 4px;
      }

      .btn-action {
        width: 32px;
        height: 32px;
        font-size: 0.95rem;
      }

      .modal-content {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="container-main">
    <!-- Header -->
    <div class="header-todo">
      <h1>✓ Minha Lista</h1>
      <p>Organize suas tarefas com simplicidade e elegância</p>
    </div>

    <!-- Main Card -->
    <div class="glass">
      <!-- Input Section -->
      <div class="input-group-todo">
        <input 
          type="text" 
          id="inputTarefa" 
          placeholder="Adicione uma nova tarefa..." 
          autocomplete="off"
        >
        <button class="btn-add" onclick="abrirModalAdd()">
          <i class="bi bi-plus-lg"></i> Adicionar
        </button>
      </div>

      <!-- Stats -->
      <div class="stats-todo">
        <div class="stat-card">
          <div class="stat-label">Total de Tarefas</div>
          <div class="stat-value total" id="totalTarefas">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Concluídas</div>
          <div class="stat-value completed" id="tarefasConcluidas">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pendentes</div>
          <div class="stat-value pending" id="tarefasPendentes">0</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-buttons">
        <button class="filter-btn active" onclick="filtrarTarefas('todas')">Todas</button>
        <button class="filter-btn" onclick="filtrarTarefas('pendentes')">Pendentes</button>
        <button class="filter-btn" onclick="filtrarTarefas('concluidas')">Concluídas</button>
      </div>

      <!-- Todo List -->
      <div class="todo-list" id="listaTarefas">
        <div class="empty-state">
          <i class="bi bi-inbox"></i>
          <h3>Sem tarefas por enquanto</h3>
          <p>Adicione sua primeira tarefa para começar! 🚀</p>
        </div>
      </div>
    </div>

    <!-- Clear All Button -->
    <div style="text-align: center; margin-top: 24px;">
      <button 
        class="btn-action" 
        onclick="limparTodas()" 
        title="Limpar todas as tarefas"
        style="width: auto; padding: 10px 20px; color: var(--red);"
      >
        <i class="bi bi-trash3"></i> Limpar Tudo
      </button>
    </div>
  </div>

  <!-- Modal para Adicionar/Editar -->
  <div id="modalTarefa" class="modal">
    <div class="modal-content">
      <button class="close-modal" onclick="fecharModal()">&times;</button>
      <div class="modal-header">
        <h2 id="modalTitle">Nova Tarefa</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="modalTarefaTexto">Descrição da Tarefa *</label>
          <textarea id="modalTarefaTexto" placeholder="Descreva sua tarefa..." rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="modalTarefaCategoria">Categoria</label>
          <select id="modalTarefaCategoria">
            <option value="">Sem categoria</option>
            <option value="Trabalho">Trabalho</option>
            <option value="Pessoal">Pessoal</option>
            <option value="Compras">Compras</option>
            <option value="Saúde">Saúde</option>
            <option value="Estudos">Estudos</option>
            <option value="Diversão">Diversão</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modalTarefaData">Data (opcional)</label>
          <input type="date" id="modalTarefaData">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-modal btn-secondary" onclick="fecharModal()">Cancelar</button>
        <button class="btn-modal btn-primary" onclick="salvarTarefa()" id="btnSalvar">Adicionar</button>
      </div>
    </div>
  </div>

  <script>
    let tarefas = [];
    let filtroAtual = 'todas';
    let editandoId = null;

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      carregarTarefas();
      renderizarTarefas();
      
      // Enter para adicionar
      document.getElementById('inputTarefa').addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
          abrirModalAdd();
        }
      });
    });

    // LocalStorage
    function salvarNoStorage() {
      localStorage.setItem('minha-lista-tarefas', JSON.stringify(tarefas));
    }

    function carregarTarefas() {
      const dados = localStorage.getItem('minha-lista-tarefas');
      tarefas = dados ? JSON.parse(dados) : [];
    }

    // Abrir Modal para Adicionar
    function abrirModalAdd() {
      editandoId = null;
      document.getElementById('modalTitle').textContent = 'Nova Tarefa';
      document.getElementById('btnSalvar').textContent = 'Adicionar';
      document.getElementById('modalTarefaTexto').value = '';
      document.getElementById('modalTarefaCategoria').value = '';
      document.getElementById('modalTarefaData').value = '';
      document.getElementById('modalTarefa').classList.add('active');
      document.getElementById('modalTarefaTexto').focus();
    }

    // Editar Tarefa
    function abrirModalEdicao(id) {
      const tarefa = tarefas.find(t => t.id === id);
      if (!tarefa) return;

      editandoId = id;
      document.getElementById('modalTitle').textContent = 'Editar Tarefa';
      document.getElementById('btnSalvar').textContent = 'Salvar Alterações';
      document.getElementById('modalTarefaTexto').value = tarefa.texto;
      document.getElementById('modalTarefaCategoria').value = tarefa.categoria || '';
      document.getElementById('modalTarefaData').value = tarefa.data || '';
      document.getElementById('modalTarefa').classList.add('active');
      document.getElementById('modalTarefaTexto').focus();
    }

    // Fechar Modal
    function fecharModal() {
      document.getElementById('modalTarefa').classList.remove('active');
      editandoId = null;
    }

    // Salvar Tarefa
    function salvarTarefa() {
      const texto = document.getElementById('modalTarefaTexto').value.trim();
      const categoria = document.getElementById('modalTarefaCategoria').value;
      const data = document.getElementById('modalTarefaData').value;

      if (!texto) {
        alert('Por favor, descreva sua tarefa!');
        return;
      }

      if (editandoId) {
        // Editar
        const tarefa = tarefas.find(t => t.id === editandoId);
        tarefa.texto = texto;
        tarefa.categoria = categoria;
        tarefa.data = data;
      } else {
        // Adicionar
        tarefas.push({
          id: Date.now(),
          texto,
          categoria,
          data,
          concluida: false,
          criada: new Date().toLocaleDateString('pt-BR')
        });
      }

      salvarNoStorage();
      renderizarTarefas();
      fecharModal();
      document.getElementById('inputTarefa').value = '';
    }

    // Deletar Tarefa
    function deletarTarefa(id) {
      if (confirm('Tem certeza que deseja deletar esta tarefa?')) {
        tarefas = tarefas.filter(t => t.id !== id);
        salvarNoStorage();
        renderizarTarefas();
      }
    }

    // Alternar Conclusão
    function alternarConclusao(id) {
      const tarefa = tarefas.find(t => t.id === id);
      if (tarefa) {
        tarefa.concluida = !tarefa.concluida;
        salvarNoStorage();
        renderizarTarefas();
      }
    }

    // Filtrar Tarefas
    function filtrarTarefas(tipo) {
      filtroAtual = tipo;
      
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      renderizarTarefas();
    }

    // Limpar Todas
    function limparTodas() {
      if (tarefas.length === 0) {
        alert('Não há tarefas para limpar!');
        return;
      }
      
      if (confirm('Tem certeza que deseja limpar todas as tarefas? Esta ação não pode ser desfeita!')) {
        tarefas = [];
        salvarNoStorage();
        renderizarTarefas();
      }
    }

    // Atualizar Stats
    function atualizarStats() {
      const total = tarefas.length;
      const concluidas = tarefas.filter(t => t.concluida).length;
      const pendentes = total - concluidas;

      document.getElementById('totalTarefas').textContent = total;
      document.getElementById('tarefasConcluidas').textContent = concluidas;
      document.getElementById('tarefasPendentes').textContent = pendentes;
    }

    // Renderizar Tarefas
    function renderizarTarefas() {
      const listaTarefas = document.getElementById('listaTarefas');
      
      let tarefasFiltradas = tarefas;
      if (filtroAtual === 'pendentes') {
        tarefasFiltradas = tarefas.filter(t => !t.concluida);
      } else if (filtroAtual === 'concluidas') {
        tarefasFiltradas = tarefas.filter(t => t.concluida);
      }

      atualizarStats();

      if (tarefasFiltradas.length === 0) {
        listaTarefas.innerHTML = `
          <div class="empty-state">
            <i class="bi bi-inbox"></i>
            <h3>Sem tarefas ${filtroAtual !== 'todas' ? filtroAtual : ''}</h3>
            <p>${filtroAtual === 'concluidas' ? 'Termine suas tarefas para vê-las aqui!' : 'Adicione uma tarefa para começar! 🚀'}</p>
          </div>
        `;
        return;
      }

      listaTarefas.innerHTML = tarefasFiltradas.map(tarefa => `
        <div class="todo-item ${tarefa.concluida ? 'completed' : ''}">
          <input 
            type="checkbox" 
            class="checkbox-todo" 
            ${tarefa.concluida ? 'checked' : ''}
            onchange="alternarConclusao(${tarefa.id})"
          >
          <div class="todo-content">
            <div class="todo-text">${escapeHtml(tarefa.texto)}</div>
            <div class="todo-meta">
              ${tarefa.criada ? `<span class="todo-date"><i class="bi bi-calendar-event"></i> ${tarefa.criada}</span>` : ''}
              ${tarefa.data ? `<span class="todo-date"><i class="bi bi-calendar-check"></i> ${new Date(tarefa.data).toLocaleDateString('pt-BR')}</span>` : ''}
              ${tarefa.categoria ? `<span class="todo-category">${tarefa.categoria}</span>` : ''}
            </div>
          </div>
          <div class="todo-actions">
            <button class="btn-action btn-edit" onclick="abrirModalEdicao(${tarefa.id})" title="Editar">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn-action btn-delete" onclick="deletarTarefa(${tarefa.id})" title="Deletar">
              <i class="bi bi-trash3"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    // Fechar modal ao clicar fora
    document.addEventListener('click', (e) => {
      const modal = document.getElementById('modalTarefa');
      if (e.target === modal) {
        fecharModal();
      }
    });

    // Escape para fechar modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fecharModal();
      }
    });

    // Função auxiliar para escapar HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
